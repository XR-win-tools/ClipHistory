<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ClipHistory</title>
<style>
:root, [data-theme="midnight"] {
  --bg-1: #1a1a1f; --bg-2: #16161a; --bg-3: #121216;
  --glow-tl: rgba(99,102,241,0.14); --glow-br: rgba(236,72,153,0.10);
  --accent: #a78bfa; --accent-rgb: 167,139,250;
  --accent-2: #ec4899; --accent-2-rgb: 236,72,153;
  --rainbow: linear-gradient(90deg,#ff0040,#ff7f00,#ffea00,#22ff6f,#00d9ff,#4f6dff,#b800ff,#ff0040);
  --rainbow-v: linear-gradient(180deg,#ff0040,#ff7f00,#ffea00,#22ff6f,#00d9ff,#4f6dff,#b800ff,#ff0040);
  --rainbow-conic: conic-gradient(from 0deg,#ff0040,#ff7f00,#ffea00,#22ff6f,#00d9ff,#4f6dff,#b800ff,#ff0040);
}
[data-theme="cyberpunk"] {
  --bg-1: #0a0e1a; --bg-2: #060810; --bg-3: #03050a;
  --glow-tl: rgba(0,217,255,0.16); --glow-br: rgba(255,0,110,0.14);
  --accent: #00d9ff; --accent-rgb: 0,217,255;
  --accent-2: #ff006e; --accent-2-rgb: 255,0,110;
  --rainbow: linear-gradient(90deg,#00d9ff,#ff006e,#ffe000,#00d9ff,#ff006e);
  --rainbow-v: linear-gradient(180deg,#00d9ff,#ff006e,#ffe000,#00d9ff,#ff006e);
  --rainbow-conic: conic-gradient(from 0deg,#00d9ff,#ff006e,#ffe000,#00d9ff);
}
[data-theme="minimal"] {
  --bg-1: #18181b; --bg-2: #141417; --bg-3: #101012;
  --glow-tl: rgba(200,200,210,0.04); --glow-br: rgba(200,200,210,0.03);
  --accent: #d4d4d8; --accent-rgb: 212,212,216;
  --accent-2: #a1a1aa; --accent-2-rgb: 161,161,170;
  --rainbow: linear-gradient(90deg,#444,#888,#bbb,#888,#444);
  --rainbow-v: linear-gradient(180deg,#444,#888,#bbb,#888,#444);
  --rainbow-conic: conic-gradient(from 0deg,#444,#888,#bbb,#888);
}
[data-theme="forest"] {
  --bg-1: #0e1a14; --bg-2: #0a1410; --bg-3: #060e0a;
  --glow-tl: rgba(52,211,153,0.13); --glow-br: rgba(163,230,53,0.09);
  --accent: #34d399; --accent-rgb: 52,211,153;
  --accent-2: #a3e635; --accent-2-rgb: 163,230,53;
  --rainbow: linear-gradient(90deg,#34d399,#a3e635,#22c55e,#34d399,#a3e635);
  --rainbow-v: linear-gradient(180deg,#34d399,#a3e635,#22c55e,#34d399,#a3e635);
  --rainbow-conic: conic-gradient(from 0deg,#34d399,#a3e635,#22c55e,#34d399);
}
[data-theme="sunset"] {
  --bg-1: #1c0f0a; --bg-2: #160a06; --bg-3: #100604;
  --glow-tl: rgba(251,146,60,0.15); --glow-br: rgba(244,114,182,0.11);
  --accent: #fb923c; --accent-rgb: 251,146,60;
  --accent-2: #f472b6; --accent-2-rgb: 244,114,182;
  --rainbow: linear-gradient(90deg,#fb923c,#ef4444,#f472b6,#fbbf24,#fb923c);
  --rainbow-v: linear-gradient(180deg,#fb923c,#ef4444,#f472b6,#fbbf24,#fb923c);
  --rainbow-conic: conic-gradient(from 0deg,#fb923c,#ef4444,#f472b6,#fbbf24,#fb923c);
}
[data-theme="sakura"] {
  --bg-1: #1a1015; --bg-2: #140b10; --bg-3: #0e060a;
  --glow-tl: rgba(244,114,182,0.13); --glow-br: rgba(251,207,232,0.08);
  --accent: #f472b6; --accent-rgb: 244,114,182;
  --accent-2: #fbcfe8; --accent-2-rgb: 251,207,232;
  --rainbow: linear-gradient(90deg,#f472b6,#fbcfe8,#c084fc,#f472b6,#fbcfe8);
  --rainbow-v: linear-gradient(180deg,#f472b6,#fbcfe8,#c084fc,#f472b6,#fbcfe8);
  --rainbow-conic: conic-gradient(from 0deg,#f472b6,#fbcfe8,#c084fc,#f472b6);
}
[data-theme="aurora"] {
  --bg-1: #0a1520; --bg-2: #060f18; --bg-3: #030a10;
  --glow-tl: rgba(45,212,191,0.13); --glow-br: rgba(96,165,250,0.11);
  --accent: #2dd4bf; --accent-rgb: 45,212,191;
  --accent-2: #60a5fa; --accent-2-rgb: 96,165,250;
  --rainbow: linear-gradient(90deg,#2dd4bf,#60a5fa,#a78bfa,#2dd4bf,#60a5fa);
  --rainbow-v: linear-gradient(180deg,#2dd4bf,#60a5fa,#a78bfa,#2dd4bf,#60a5fa);
  --rainbow-conic: conic-gradient(from 0deg,#2dd4bf,#60a5fa,#a78bfa,#2dd4bf);
}
[data-theme="ocean"] {
  --bg-1: #0a1220; --bg-2: #060c18; --bg-3: #03060e;
  --glow-tl: rgba(59,130,246,0.15); --glow-br: rgba(6,182,212,0.11);
  --accent: #3b82f6; --accent-rgb: 59,130,246;
  --accent-2: #06b6d4; --accent-2-rgb: 6,182,212;
  --rainbow: linear-gradient(90deg,#3b82f6,#06b6d4,#60a5fa,#3b82f6,#06b6d4);
  --rainbow-v: linear-gradient(180deg,#3b82f6,#06b6d4,#60a5fa,#3b82f6,#06b6d4);
  --rainbow-conic: conic-gradient(from 0deg,#3b82f6,#06b6d4,#60a5fa,#3b82f6);
}
:root {
  --fg-1: #f0f0f4; --fg-2: #cfcfd6; --fg-3: #a0a0aa;
  --fg-4: #666; --fg-5: #404046;
  --gold: #fbbf24; --gold-rgb: 251,191,36;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: transparent; overflow: hidden;
  font-family: "Segoe UI Variable Display", "Microsoft YaHei UI", "Segoe UI", sans-serif;
  color: var(--fg-2); user-select: none;
  -webkit-font-smoothing: antialiased;
  transition: color 0.3s;
}
.app {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse 800px 400px at 0% 0%, var(--glow-tl), transparent 55%),
    radial-gradient(ellipse 700px 400px at 100% 100%, var(--glow-br), transparent 55%),
    radial-gradient(ellipse 500px 300px at 50% 50%, rgba(255,255,255,0.015), transparent 60%),
    linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  overflow: hidden; isolation: isolate;
  transition: background 0.4s;
}
.app::before {
  content: ''; position: absolute; inset: 0;
  pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 1;
}
.app::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06) 20%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.06) 80%, transparent);
  pointer-events: none; z-index: 2;
}
.corner-glow {
  position: absolute; width: 240px; height: 240px;
  border-radius: 50%; pointer-events: none; filter: blur(60px);
  opacity: 0.35; z-index: 0;
  animation: pulse-glow 8s ease-in-out infinite;
  transition: background 0.4s;
}
.corner-glow.tl { top: -100px; left: -100px; background: var(--accent); }
.corner-glow.br { bottom: -100px; right: -100px; background: var(--accent-2); animation-delay: -4s; }
@keyframes pulse-glow {
  0%, 100% { opacity: 0.25; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(1.15); }
}
.rainbow-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--rainbow); background-size: 200% 100%;
  animation: rainbow-flow 5s linear infinite; z-index: 100;
  box-shadow: 0 0 12px rgba(var(--accent-2-rgb), 0.35), 0 0 4px rgba(var(--accent-rgb), 0.5);
  transition: box-shadow 0.4s;
}
@keyframes rainbow-flow {
  0%   { background-position: 0%   50%; }
  100% { background-position: 200% 50%; }
}
.search {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 16px 20px 14px; flex-shrink: 0; margin-top: 3px; z-index: 10;
}
.search::before {
  content: ''; position: absolute; bottom: 0; left: 20px; right: 20px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07) 30%, rgba(255,255,255,0.07) 70%, transparent);
}
.search-icon {
  flex-shrink: 0; color: var(--fg-4);
  transition: color 0.3s var(--ease-out), filter 0.3s var(--ease-out), transform 0.5s var(--ease-out);
}
.search:hover .search-icon { color: var(--fg-3); }
.search:focus-within .search-icon {
  color: var(--accent);
  filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), 0.7));
  transform: rotate(-8deg) scale(1.08);
}
.search input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--fg-1); font-size: 15px; font-family: inherit;
  letter-spacing: 0.15px; padding: 2px 0;
}
.search input::placeholder { color: var(--fg-5); transition: color 0.25s, letter-spacing 0.25s; }
.search input:focus::placeholder { color: #4a4a52; letter-spacing: 0.5px; }
.search::after {
  content: ''; position: absolute; bottom: -1px; left: 20px; right: 20px;
  height: 1.5px; background: var(--rainbow); background-size: 200% 100%;
  border-radius: 1px; opacity: 0; transform: scaleX(0);
  transform-origin: center;
  transition: opacity 0.4s var(--ease-out), transform 0.45s var(--ease-out);
  animation: rainbow-flow 3s linear infinite;
  box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.4);
}
.search:focus-within::after { opacity: 1; transform: scaleX(1); }

.list {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 10px 10px 12px; scroll-behavior: smooth;
  position: relative; z-index: 5;
}
.list::-webkit-scrollbar { width: 10px; }
.list::-webkit-scrollbar-track { background: transparent; margin: 4px 0; }
.list::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.7), rgba(var(--accent-2-rgb), 0.7));
  border-radius: 6px; border: 2px solid rgba(0,0,0,0.3);
  background-clip: padding-box;
  transition: all 0.25s var(--ease-out);
}
.list::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.7);
  border-width: 1px;
}

.section-header {
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px; color: var(--fg-4);
  text-transform: uppercase; letter-spacing: 1.5px;
  padding: 10px 8px 6px; font-weight: 600;
  user-select: none;
}
.section-header::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.07), transparent);
}
.section-header.pinned {
  color: var(--gold);
  text-shadow: 0 0 8px rgba(var(--gold-rgb), 0.3);
}
.section-header.pinned::after {
  background: linear-gradient(90deg, rgba(var(--gold-rgb), 0.25), transparent);
}
.section-header:first-child { padding-top: 2px; }

.item {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 10px 10px 16px;
  border-radius: 10px; cursor: pointer;
  margin-bottom: 3px; overflow: hidden;
  background: linear-gradient(135deg, rgba(255,255,255,0.022), rgba(255,255,255,0.008));
  border: 1px solid rgba(255,255,255,0.025);
  transition: background 0.18s var(--ease-out), transform 0.18s var(--ease-out), border-color 0.18s var(--ease-out), box-shadow 0.22s var(--ease-out);
  animation: slide-in 0.35s var(--ease-out) both;
}
@keyframes slide-in {
  from { opacity: 0; transform: translateX(-6px) translateY(-2px); }
  to   { opacity: 1; transform: translateX(0) translateY(0); }
}
.item:nth-child(1)  { animation-delay: 0ms;   }
.item:nth-child(2)  { animation-delay: 20ms;  }
.item:nth-child(3)  { animation-delay: 40ms;  }
.item:nth-child(4)  { animation-delay: 60ms;  }
.item:nth-child(5)  { animation-delay: 80ms;  }
.item:nth-child(n+6){ animation-delay: 100ms; }

.item::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent);
  pointer-events: none; border-radius: 10px 10px 0 0;
}
.item::before {
  content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px;
  background: var(--rainbow-v); background-size: 100% 200%;
  border-radius: 0 2px 2px 0;
  opacity: 0; transform: scaleY(0.4);
  transition: opacity 0.22s var(--ease-out), transform 0.28s var(--ease-out);
  animation: rainbow-flow-v 3s linear infinite;
  box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5);
  z-index: 3;
}
@keyframes rainbow-flow-v {
  0%   { background-position: 50% 0%; }
  100% { background-position: 50% 200%; }
}
.item.pinned {
  background: linear-gradient(135deg, rgba(var(--gold-rgb), 0.06), rgba(var(--gold-rgb), 0.02));
  border-color: rgba(var(--gold-rgb), 0.15);
}
.item.pinned::before {
  background: linear-gradient(180deg, var(--gold), #f59e0b, var(--gold));
  opacity: 0.7; transform: scaleY(1);
  box-shadow: 0 0 8px rgba(var(--gold-rgb), 0.5);
  animation: none;
}
.item:hover {
  background: linear-gradient(135deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
  border-color: rgba(255,255,255,0.06);
  transform: translateX(2px);
  box-shadow: 0 2px 8px -2px rgba(0,0,0,0.3);
}
.item.pinned:hover {
  background: linear-gradient(135deg, rgba(var(--gold-rgb), 0.10), rgba(var(--gold-rgb), 0.03));
  border-color: rgba(var(--gold-rgb), 0.25);
}
.item.selected {
  background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.22) 0%, rgba(var(--accent-2-rgb), 0.12) 50%, rgba(var(--accent-rgb), 0.04) 100%);
  border-color: rgba(var(--accent-rgb), 0.28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 24px rgba(var(--accent-rgb), 0.08), 0 3px 14px -4px rgba(var(--accent-rgb), 0.4);
  transform: translateX(2px);
}
.item.pinned.selected {
  background: linear-gradient(90deg, rgba(var(--gold-rgb), 0.22) 0%, rgba(var(--accent-rgb), 0.16) 50%, rgba(var(--accent-rgb), 0.04) 100%);
  border-color: rgba(var(--gold-rgb), 0.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 24px rgba(var(--gold-rgb), 0.10), 0 3px 14px -4px rgba(var(--gold-rgb), 0.4);
}
.item.selected::before { opacity: 1; transform: scaleY(1); }
.item:active { transform: translateX(2px) scale(0.995); transition-duration: 0.05s; }

.item .badge {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 6px;
  font-size: 10px; font-weight: 600; color: var(--fg-4);
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.04);
  transition: all 0.2s var(--ease-out);
  font-variant-numeric: tabular-nums;
}
.item:hover .badge { color: var(--fg-3); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
.item.selected .badge {
  color: #ffffff; background: rgba(var(--accent-rgb), 0.3);
  border-color: rgba(var(--accent-rgb), 0.5);
  box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.3);
}
.item.pinned .badge {
  color: var(--gold);
  background: rgba(var(--gold-rgb), 0.12);
  border-color: rgba(var(--gold-rgb), 0.25);
}

.item .text {
  flex: 1; font-size: 14px; line-height: 1.5; color: var(--fg-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color 0.18s;
}
.item:hover .text { color: #eeeff4; }
.item.selected .text { color: #ffffff; font-weight: 500; }

.item .star {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 6px;
  color: rgba(255,255,255,0.18); cursor: pointer;
  transition: color 0.18s var(--ease-out), background 0.18s, transform 0.15s;
  opacity: 0.3;
}
.item:hover .star { opacity: 1; color: rgba(255,255,255,0.45); }
.item .star:hover {
  color: var(--gold);
  background: rgba(var(--gold-rgb), 0.12);
  transform: scale(1.15);
}
.item .star svg {
  fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round;
  transition: fill 0.18s;
}
.item.pinned .star {
  opacity: 1; color: var(--gold);
  filter: drop-shadow(0 0 5px rgba(var(--gold-rgb), 0.5));
}
.item.pinned .star svg { fill: currentColor; }
.item.pinned .star:hover { color: #f59e0b; }

.item .time {
  flex-shrink: 0; font-size: 11px; color: var(--fg-4);
  padding: 3px 9px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.03);
  border-radius: 10px;
  transition: all 0.22s var(--ease-out);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.item:hover .time {
  color: var(--fg-3);
  background: rgba(255,255,255,0.065);
  border-color: rgba(255,255,255,0.06);
}
.item.selected .time {
  color: #ede8ff;
  background: rgba(var(--accent-rgb), 0.26);
  border-color: rgba(var(--accent-rgb), 0.4);
  box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.25), inset 0 1px 0 rgba(255,255,255,0.1);
}
.item.pinned.selected .time {
  color: #fff4d6;
  background: rgba(var(--gold-rgb), 0.26);
  border-color: rgba(var(--gold-rgb), 0.45);
}

.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 20px;
  color: var(--fg-4); font-size: 14px;
  animation: fade-in 0.5s var(--ease-out);
}
@keyframes fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.empty .icon-wrap {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  width: 84px; height: 84px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.12), rgba(var(--accent-2-rgb), 0.06));
  border: 1px solid rgba(var(--accent-rgb), 0.18);
  box-shadow: inset 0 0 30px rgba(var(--accent-rgb), 0.08), 0 4px 20px -8px rgba(var(--accent-rgb), 0.2);
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
.empty .icon-wrap::before {
  content: ''; position: absolute; inset: -4px;
  border-radius: 50%; background: var(--rainbow-conic);
  opacity: 0.5; filter: blur(12px);
  animation: spin 8s linear infinite; z-index: -1;
}
.empty .icon-wrap::after {
  content: ''; position: absolute; inset: -1px;
  border-radius: 50%; background: var(--rainbow-conic);
  opacity: 0.35; animation: spin 12s linear infinite reverse; z-index: -1;
  mask: radial-gradient(circle, transparent 55%, black 60%);
  -webkit-mask: radial-gradient(circle, transparent 55%, black 60%);
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty svg {
  color: var(--accent); opacity: 0.9;
  filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.5));
}
.empty .msg { color: var(--fg-3); font-size: 13.5px; letter-spacing: 0.3px; font-weight: 500; }
.empty .hint { color: var(--fg-5); font-size: 12px; margin-top: -8px; }

.footer {
  position: relative; display: flex; gap: 14px;
  padding: 12px 20px 13px; font-size: 12px;
  color: var(--fg-3); flex-shrink: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.30));
  align-items: center;
  border-top: 1px solid rgba(255,255,255,0.05);
  z-index: 10;
}
.footer::before {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: var(--rainbow); background-size: 200% 100%;
  animation: rainbow-flow 5s linear infinite; opacity: 0.55;
  box-shadow: 0 -1px 6px rgba(var(--accent-rgb), 0.25);
}
.footer span { display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s; white-space: nowrap; }
.footer span:hover { color: var(--fg-2); }
.footer kbd {
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 5px; padding: 2px 6px;
  font-family: inherit; font-size: 10.5px; font-weight: 500;
  color: #bdbdc7; min-width: 18px; height: 20px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.04), inset 0 1px 0 rgba(255,255,255,0.10), 0 1px 2px rgba(0,0,0,0.2);
  transition: all 0.18s var(--ease-out);
  cursor: default;
}
.footer kbd:hover {
  color: #f0eaff;
  border-color: rgba(var(--accent-rgb), 0.5);
  background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.15), rgba(var(--accent-rgb), 0.05));
  box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.35), inset 0 1px 0 rgba(255,255,255,0.12);
  transform: translateY(-1px);
}
.footer kbd:active {
  transform: translateY(0);
  box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.3), inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -1px 2px rgba(0,0,0,0.2);
}
.footer .sep {
  margin-left: auto; color: var(--fg-5); font-size: 10px;
  letter-spacing: 2px; text-transform: uppercase; font-weight: 600; opacity: 0.8;
}
.theme-btn {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08); border-radius: 7px;
  color: var(--fg-3); cursor: pointer;
  transition: all 0.18s var(--ease-out); margin-left: 4px;
}
.theme-btn:hover {
  color: var(--accent);
  border-color: rgba(var(--accent-rgb), 0.5);
  box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.3);
  transform: translateY(-1px);
}
.theme-btn:active { transform: scale(0.94) translateY(0); }
.theme-btn.active {
  color: var(--accent);
  border-color: rgba(var(--accent-rgb), 0.6);
  background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.15), rgba(var(--accent-rgb), 0.05));
}
.theme-panel {
  position: absolute; bottom: 52px; right: 14px; width: 268px;
  background: rgba(20, 20, 24, 0.88);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03), inset 0 1px 0 rgba(255,255,255,0.06);
  opacity: 0; transform: translateY(8px) scale(0.96);
  transform-origin: bottom right; pointer-events: none;
  transition: opacity 0.22s var(--ease-out), transform 0.22s var(--ease-out);
  z-index: 200;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.theme-panel.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.theme-panel-header {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--fg-3);
  margin-bottom: 12px; padding: 0 4px; font-weight: 500;
}
.theme-panel-header::before {
  content: ''; width: 3px; height: 12px; border-radius: 2px;
  background: var(--rainbow-v); background-size: 100% 200%;
  animation: rainbow-flow-v 3s linear infinite;
}
.theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.theme-card {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px; color: var(--fg-3);
  font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all 0.18s var(--ease-out); text-align: left;
}
.theme-card:hover {
  background: rgba(255,255,255,0.07); color: var(--fg-1);
  transform: translateY(-1px); border-color: rgba(255,255,255,0.1);
}
.theme-card.active {
  border-color: var(--accent);
  background: rgba(var(--accent-rgb), 0.14);
  color: var(--fg-1);
  box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.2), inset 0 0 0 1px rgba(var(--accent-rgb), 0.3);
}
.theme-preview {
  width: 18px; height: 18px; border-radius: 5px;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 1px 3px rgba(0,0,0,0.3);
}
.theme-name { font-size: 11.5px; }
</style>
</head>
<body>

<div class="app">
  <div class="corner-glow tl"></div>
  <div class="corner-glow br"></div>
  <div class="rainbow-bar"></div>

  <div class="search">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </svg>
    <input id="q" placeholder="搜索剪贴板历史…" autocomplete="off" spellcheck="false">
  </div>

  <div class="list" id="list"></div>

  <div class="footer">
    <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
    <span><kbd>Enter</kbd> 粘贴</span>
    <span><kbd>Ctrl</kbd>+<kbd>P</kbd> 收藏</span>
    <span><kbd>Del</kbd> 删除</span>
    <span><kbd>Esc</kbd> 关闭</span>
    <span class="sep">ClipHistory</span>
    <button class="theme-btn" id="themeBtn" title="切换主题">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
        <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
        <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
        <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
      </svg>
    </button>
  </div>

  <div class="theme-panel" id="themePanel">
    <div class="theme-panel-header">选择主题</div>
    <div class="theme-grid">
      <button class="theme-card" data-theme="midnight"><span class="theme-preview" style="--p1:#a78bfa; --p2:#ec4899;"></span><span class="theme-name">暗夜紫</span></button>
      <button class="theme-card" data-theme="cyberpunk"><span class="theme-preview" style="--p1:#00d9ff; --p2:#ff006e;"></span><span class="theme-name">赛博朋克</span></button>
      <button class="theme-card" data-theme="minimal"><span class="theme-preview" style="--p1:#d4d4d8; --p2:#a1a1aa;"></span><span class="theme-name">极简</span></button>
      <button class="theme-card" data-theme="forest"><span class="theme-preview" style="--p1:#34d399; --p2:#a3e635;"></span><span class="theme-name">森林</span></button>
      <button class="theme-card" data-theme="sunset"><span class="theme-preview" style="--p1:#fb923c; --p2:#f472b6;"></span><span class="theme-name">日落</span></button>
      <button class="theme-card" data-theme="sakura"><span class="theme-preview" style="--p1:#f472b6; --p2:#fbcfe8;"></span><span class="theme-name">樱花</span></button>
      <button class="theme-card" data-theme="aurora"><span class="theme-preview" style="--p1:#2dd4bf; --p2:#60a5fa;"></span><span class="theme-name">极光</span></button>
      <button class="theme-card" data-theme="ocean"><span class="theme-preview" style="--p1:#3b82f6; --p2:#06b6d4;"></span><span class="theme-name">午夜蓝</span></button>
    </div>
  </div>
</div>

<script>
  const send = (msg) => window.chrome?.webview?.postMessage(msg);
  const $q = document.getElementById('q');
  const $list = document.getElementById('list');
  const $themeBtn = document.getElementById('themeBtn');
  const $themePanel = document.getElementById('themePanel');

  let all = [];
  let view = [];
  let selected = 0;

  const THEME_KEY = 'cliphistory.theme';
  const STAR_SVG = '<svg width="14" height="14" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

  function getStoredTheme() {
    try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
  }
  function setStoredTheme(name) {
    try { localStorage.setItem(THEME_KEY, name); } catch (e) { }
  }
  function applyTheme(name) {
    document.documentElement.dataset.theme = name;
    document.querySelectorAll('.theme-card').forEach(c => {
      c.classList.toggle('active', c.dataset.theme === name);
    });
  }
  function saveTheme(name) {
    setStoredTheme(name);
    send({ type: 'setTheme', name });
  }
  applyTheme(getStoredTheme() || 'midnight');

  $themeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    $themePanel.classList.toggle('show');
    $themeBtn.classList.toggle('active', $themePanel.classList.contains('show'));
  });
  document.querySelectorAll('.theme-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      applyTheme(card.dataset.theme);
      saveTheme(card.dataset.theme);
      $themePanel.classList.remove('show');
      $themeBtn.classList.remove('active');
    });
  });
  document.addEventListener('click', (e) => {
    if (!$themePanel.classList.contains('show')) return;
    if ($themePanel.contains(e.target)) return;
    if ($themeBtn.contains(e.target)) return;
    $themePanel.classList.remove('show');
    $themeBtn.classList.remove('active');
  });

  function relTime(iso) {
    const d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (d < 60) return '刚刚';
    if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
    if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
    if (d < 2592000) return Math.floor(d / 86400) + ' 天前';
    return new Date(iso).toLocaleDateString('zh-CN');
  }

  function render() {
    const q = $q.value.trim().toLowerCase();
    view = q ? all.filter(x => x.text.toLowerCase().includes(q)) : all.slice();
    if (selected >= view.length) selected = Math.max(0, view.length - 1);

    if (view.length === 0) {
      $list.innerHTML = `
        <div class="empty">
          <div class="icon-wrap">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            </svg>
          </div>
          <div class="msg">${q ? '没有匹配的记录' : '还没有剪贴板历史'}</div>
          <div class="hint">${q ? '换个关键词试试' : '复制点什么试试吧'}</div>
        </div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    const hasPinned = view.some(x => x.pinned);
    const hasNonPinned = view.some(x => !x.pinned);
    const showHeaders = hasPinned && hasNonPinned;

    let lastGroup = null;
    view.forEach((it, i) => {
      const group = it.pinned ? 'pinned' : 'recent';
      if (showHeaders && group !== lastGroup) {
        const h = document.createElement('div');
        h.className = 'section-header' + (group === 'pinned' ? ' pinned' : '');
        h.textContent = group === 'pinned' ? '★ 已收藏' : '最近';
        frag.appendChild(h);
      }
      lastGroup = group;

      const div = document.createElement('div');
      div.className = 'item' + (i === selected ? ' selected' : '') + (it.pinned ? ' pinned' : '');
      div.dataset.i = i;

      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = i + 1;

      const t = document.createElement('div');
      t.className = 'text';
      t.textContent = it.text.replace(/\s+/g, ' ').trim().slice(0, 300);

      const tm = document.createElement('div');
      tm.className = 'time';
      tm.textContent = relTime(it.time);

      const star = document.createElement('div');
      star.className = 'star';
      star.innerHTML = STAR_SVG;
      star.title = it.pinned ? '取消收藏 (Ctrl+P)' : '收藏 (Ctrl+P)';

      div.append(badge, t, tm, star);
      frag.appendChild(div);
    });

    $list.replaceChildren(frag);
    const sel = $list.querySelector('.item.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  if (window.chrome?.webview) {
    window.chrome.webview.addEventListener('message', (e) => {
      const m = e.data;
      if (m.type === 'init') {
        if (m.theme) applyTheme(m.theme);
        all = m.items || [];
        selected = 0;
        render();
        $q.value = '';
        $q.focus();
      } else if (m.type === 'update') {
        all = m.items || [];
        const q = $q.value.trim().toLowerCase();
        const filtered = q ? all.filter(x => x.text.toLowerCase().includes(q)) : all.slice();
        if (m.focusText) {
          const idx = filtered.findIndex(x => x.text === m.focusText);
          selected = idx >= 0 ? idx : 0;
        } else {
          selected = Math.max(0, Math.min(selected, filtered.length - 1));
        }
        render();
      }
    });
  }

  $q.addEventListener('input', () => { selected = 0; render(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (selected < view.length - 1) { selected++; render(); }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (selected > 0) { selected--; render(); }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const it = view[selected];
      if (it) send({ type: 'paste', text: it.text });
    } else if ((e.key === 'p' || e.key === 'P') && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      const it = view[selected];
      if (it) send({ type: 'pin', text: it.text });
    } else if (e.key === 'Delete') {
      e.preventDefault();
      const it = view[selected];
      if (it) send({ type: 'delete', text: it.text });
    } else if (e.key === 'Escape') {
      e.preventDefault();
      send({ type: 'close' });
    }
  });

  $list.addEventListener('mousedown', (e) => {
    if (e.target.closest('.star')) return;
    const item = e.target.closest('.item');
    if (!item) return;
    e.preventDefault();
    const i = +item.dataset.i;
    if (e.detail === 2) {
      send({ type: 'paste', text: view[i].text });
    } else {
      selected = i;
      render();
      send({ type: 'paste', text: view[i].text });
    }
  });

  $list.addEventListener('click', (e) => {
    const star = e.target.closest('.star');
    if (!star) return;
    e.preventDefault();
    e.stopPropagation();
    const item = star.closest('.item');
    if (!item) return;
    const i = +item.dataset.i;
    send({ type: 'pin', text: view[i].text });
  });

  send({ type: 'ready' });
</script>
</body>
</html>
